[build-system]
requires = [
  "setuptools>=58",
  "wheel>=0.37",
]
build-backend = "setuptools.build_meta"

[project]
name = "reviewcompass3"
version = "0.0.1"
description = "ReviewCompass scratch rebuild"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6,<7",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
development = [
  "pytest>=8.4,<9",
]

[project.scripts]
reviewcompass3-session-logs = "tools.session_logs.entry:main"
reviewcompass3-bootstrap-review = "tools.bootstrap.review_cli:main"
reviewcompass3-pilot = "tools.development.pilot_collaboration_cli:main"
reviewcompass3-claude-implementation = "tools.development.claude_implementation_route_cli:main"
reviewcompass3-review-plan = "tools.development.review_plan_cli:main"
reviewcompass3-trusted-transport = "tools.deployment.trusted_claude_transport:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.reviewcompass3.bootstrap]
lifecycle = "provisional"
normative_status = "non-normative"
promotion_required = true
