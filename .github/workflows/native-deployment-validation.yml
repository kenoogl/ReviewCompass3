name: Native deployment validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-install:
    name: Package ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Validate installed entry
        shell: bash
        run: reviewcompass3-session-logs validate-native --check package --evidence "${{ runner.temp }}/native-package.json"
      - name: Validate native deployment paths
        shell: bash
        run: reviewcompass3-session-logs validate-native --check paths --project-root "${{ github.workspace }}" --raw-root "${{ runner.temp }}/raw" --evidence "${{ runner.temp }}/native-paths.json"
      - name: Upload value-free evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-package-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/native-package.json
            ${{ runner.temp }}/native-paths.json
          if-no-files-found: error
